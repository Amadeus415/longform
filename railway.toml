# Railway deployment config for always-on Longform (Web + API + yt-dlp Audio + SQLite Sync).
# Attach a persistent Volume mounted at /data in Railway service settings.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
